name: X Scraper

on:
  workflow_dispatch:
    inputs:
      username:
        description: "X username, for example NASA"
        required: true
        type: string

      limit:
        description: "Number of posts"
        required: false
        default: "5"
        type: string

jobs:
  scrape:
    runs-on: ubuntu-24.04

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python scraper.py \
            --username "${{ inputs.username }}" \
            --limit "${{ inputs.limit }}" \
            --output result.json

      - name: Show result
        if: always()
        run: |
          echo "========== RESULT =========="
          if [ -f result.json ]; then
            cat result.json
          else
            echo "result.json was not created"
          fi
          echo "============================"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraper-result-${{ github.run_id }}
          path: result.json
          if-no-files-found: warn
          retention-days: 1
